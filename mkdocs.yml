site_name: IGT Model Comparison
site_description: Comparison of Q-learning and PVL-Delta models for the Iowa Gambling Task

theme:
  name: material

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to Dracula mode

    - media: "(prefers-color-scheme: dark)"
      scheme: dracula
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - navigation.tracking

    - search.suggest
    - search.highlight

    - content.code.copy
    - content.code.select
    - content.code.annotate

    - content.tabs.link

    - toc.follow

nav:
  - Home: index.md

  - Models:
      - Overview: models/index.md
      - Q-learning: models/q_learning.md
      - PVL-Delta: models/pvl_delta.md

  - API Reference:
      - Overview: api/index.md

      - Models:
          - Overview: api/models/index.md
          - Base model: api/models/base.md
          - Q-learning: api/models/q_learning.md
          - PVL-Delta: api/models/pvl_delta.md

      - Fitting: api/fitting.md
      - Initialization: api/initialization.md
      - Comparison: api/comparison.md
      - Main workflow: api/main.md
      - RData preprocessing: api/rdata_preprocessing.md
      - Typing: api/typing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            show_source: true
            separate_signature: true
            show_signature_annotations: true
            scoped_crossrefs: true
            relative_crossrefs: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_css:
  - https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap
  - stylesheets/extra.css
  - stylesheets/catppuccin-latte.css
  - stylesheets/catppuccin-mocha.css
  - stylesheets/dracula.css

extra_javascript:
  - scripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js