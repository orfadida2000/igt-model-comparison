site_name: IGT Model Comparison
site_url: https://orfadida2000.github.io/igt-model-comparison/
site_description: Documentation for the Q-learning and PVL-Delta Iowa Gambling Task model comparison

repo_url: https://github.com/orfadida2000/igt-model-comparison
repo_name: orfadida2000/igt-model-comparison

theme:
  name: material

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: dracula
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.tracking
    - navigation.path
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Project structure: project-structure.md
  - Data: data.md

  - Models:
      - Overview: models/index.md
      - Q-learning: models/q-learning.md
      - PVL-Delta: models/pvl-delta.md

  - Scripts:
      - Overview: scripts/index.md
      - PVL-Delta fit correction: scripts/correct-pvl-delta-fits.md
      - Q inverse-temperature sensitivity: scripts/q-inverse-temperature-sensitivity.md
      - Final result analysis: scripts/results-analysis.md

  - Workflows:
      - Fitting and comparison: workflow/fitting.md
      - PVL-Delta correction: workflow/correction.md
      - Q inverse-temperature sensitivity: workflow/sensitivity.md
      - Final result analysis: workflow/analysis.md

  - Statistical inference: statistical-inference.md
  - Result files: results.md
  - Final results: final-results.md
  - Reproducibility: reproducibility.md

  - API Reference:
      - Overview: api/index.md
      - Models: api/models.md
      - Execution: api/execution.md
      - Analysis: api/analysis.md
      - Comparison, initialization, and selection: api/comparison-selection.md
      - Data preprocessing: api/data.md
      - CLI parsing: api/cli-parsing.md
      - Infrastructure and utilities: api/infrastructure.md
      - Constants: api/constants.md
      - Entry points and scripts: api/entry-points.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            filters:
              - "!^__weakref__$"
              - "!^__dict__$"
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            show_source: true
            separate_signature: true
            show_signature_annotations: true
            scoped_crossrefs: true
            relative_crossrefs: true
            signature_crossrefs: true
            show_if_no_docstring: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_css:
  - https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap
  - assets/stylesheets/extra.css
  - assets/stylesheets/catppuccin-latte.css
  - assets/stylesheets/catppuccin-mocha.css
  - assets/stylesheets/dracula.css

extra_javascript:
  - assets/scripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

copyright: Copyright &copy; 2026 Or Fadida

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/orfadida2000
      name: GitHub profile

    - icon: fontawesome/solid/envelope
      link: mailto:or@fadida.net
      name: Email
