[project]
name = "igt-model-comparison"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pyreadr>=0.5.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "tqdm>=4.69.0",
]

[dependency-groups]
docs = [
    "mkdocs-material>=9,<10",
    "mkdocstrings[python]>=1.0.6",
    "ruff>=0.15.22",
]

[tool.uv]
package        = false
cache-dir      = "H:/Projects/.uv-cache"
default-groups = ["docs"]
