[project]
name = "igt-model-comparison"
version = "2.0.0"
description = "Comparison of the Q-learning and PVL-Delta models for the Iowa Gambling Task"
authors = [{ name = "Or Fadida", email = "or@fadida.net" }]
license = { file = "LICENSE" }
readme = "README.md"
keywords = [
    "Cognitive Modeling",
    "Iowa Gambling Task",
    "PVL-Delta",
    "Q-learning",
    "Reinforcement Learning",
]

requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pyreadr>=0.5.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "tqdm>=4.69.0",
]

[dependency-groups]
dev = ["pathspec>=1.1.1", "ruff>=0.15.22"]

docs = ["mkdocs-material>=9,<10", "mkdocstrings[python]>=1.0.6"]

[tool.uv]
package        = false
default-groups = ["dev", "docs"]
